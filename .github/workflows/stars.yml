name: Update Star Badge

# Finds my most-starred repository and re-renders stars.svg -- a GitHub-style Star button
# whose count "rolls" up like an odometer. Technique ported from nubjs/nub.

on:
  workflow_dispatch:
  schedule:
    # Daily at 06:30 UTC (10:30 Asia/Dubai).
    - cron: "30 6 * * *"
  push:
    branches:
      - main
    paths:
      - scripts/generate_stars.py
      - .github/workflows/stars.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate stars.svg
        env:
          GITHUB_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_stars.py --out stars.svg

      - name: Commit updated badge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stars.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: update stars.svg"
          git push
